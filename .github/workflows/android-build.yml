name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        env:
          NEXORA_API_TOKEN: ${{ secrets.NEXORA_API_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -PnexoraApiToken="$NEXORA_API_TOKEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-markets-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
